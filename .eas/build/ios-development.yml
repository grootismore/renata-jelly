# Custom EAS Build config for iOS development client (internal distribution),
# forcing bun.
#
# Mirrors ios-production.yml. That file exists because EAS's default managed
# install/prebuild steps (eas/install_node_modules, eas/prebuild) auto-detect
# the package manager from lockfiles and don't reliably pick up this
# project's bun.lock, falling back to yarn and breaking install (see the
# comment in android-production.yml for the fuller explanation). Before this
# file existed, the base "development" profile in eas.json had no matching
# override and used EAS's default managed steps — the same risk applied to
# the first iOS dev-client build, just unverified because no one had run it
# yet. This file closes that gap using the same proven bun-forcing steps as
# production, with the development/internal-distribution behavior (dev
# client, ad hoc-style internal signing) driven by the eas.json profile
# fields (developmentClient, distribution) rather than anything in here.
build:
  name: iOS development client (bun)
  steps:
    - eas/checkout

    # utils/jellyseerr is a git submodule (public repo, HTTPS). Per Expo's
    # own docs (docs.expo.dev/build-reference/git-submodules), eas/checkout
    # only uploads submodule content as-is when a build is triggered from a
    # local working directory that already has it checked out — a build
    # triggered by EAS's GitHub integration (a fresh clone on EAS's side) will
    # NOT have it, silently leaving utils/jellyseerr/ empty and breaking the
    # Metro bundle (hooks/useJellyseerr.ts and useJellyseerrCanRequest.ts
    # import from it directly). Pinned to the committed submodule commit (no
    # --remote) for build reproducibility — unlike the local-dev-only `bun
    # run submodule-reload` script, which deliberately tracks the latest
    # commit on the submodule's branch. Safe to run even when the submodule
    # is already present (no-op).
    - run:
        name: Initialize git submodules
        command: git submodule update --init --recursive

    - run:
        name: Install dependencies (bun, frozen)
        command: bun install --frozen-lockfile

    - eas/resolve_apple_team_id_from_credentials:
        id: resolve_team

    # ios/ is gitignored, so generate native code fresh. --no-install skips
    # JS + pod install; we install pods explicitly below with bun deps.
    - run:
        name: Prebuild (iOS, bun)
        command: bun x expo prebuild --platform ios --no-install

    - run:
        name: Install CocoaPods
        working_directory: ./ios
        command: pod install

    - eas/configure_ios_credentials
    - eas/configure_ios_version

    - eas/generate_gymfile_from_template:
        inputs:
          credentials: ${ eas.job.secrets.buildCredentials }

    - eas/run_fastlane
    - eas/find_and_upload_build_artifacts
