name: Renata iOS Build Validation

# Unsigned compilation validation only: proves the generated iOS native
# project (Expo prebuild + CocoaPods + MPVKit + native Swift controls)
# compiles cleanly on a real macOS/Xcode toolchain. Produces no installable
# signed IPA and requires zero Apple credentials — see
# scripts/ios/build-ios.ts's --production/--skip-credentials path (the same
# one build-apps.yml's existing "Build iOS IPA (Phone - Unsigned)" job uses).
#
# Manual dispatch always available. Push trigger is intentionally scoped to
# the single active Renata development branch (not develop/master, which
# already run the full build-apps.yml matrix) to avoid burning macOS runner
# minutes on unrelated branches, and skips documentation-only changes.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - claude/renata-baseline-phase-0-e2kfu8
    paths-ignore:
      - "**.md"

# Exposed to `expo prebuild` (app.config.ts → extra.build), same as build-apps.yml.
env:
  EXPO_PUBLIC_GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
  EXPO_PUBLIC_GIT_COMMIT: ${{ github.sha }}
  EXPO_PUBLIC_GIT_RUN_NUMBER: ${{ github.run_number }}

jobs:
  ios-build-validation:
    # macos-26 + Xcode 26.6: matches build-apps.yml's existing, working iOS
    # jobs. Not "macos-latest" deliberately — this project's
    # plugins/with-runtime-framework-headers.ts Podfile patch exists
    # specifically to work around an Xcode 26 / iOS 26 SwiftUI
    # framework-split linker error affecting the SwiftUI-based pods (ExpoUI,
    # GlassEffectView, GlassPoster) the Native player's controls layer uses,
    # so the runner/Xcode combination is load-bearing, not incidental.
    runs-on: macos-26
    name: 🍎 Compile Renata (iOS, unsigned)
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout code (with submodules)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          show-progress: false

      - name: 🔍 Verify submodules populated
        # Phase 0 found utils/jellyseerr checked out empty breaks the
        # TypeScript build; confirm the checkout actually populated it
        # before spending any more of this (expensive) macOS job on it.
        run: |
          set -euo pipefail
          if [ -z "$(ls -A utils/jellyseerr 2>/dev/null)" ]; then
            echo "::error::utils/jellyseerr is empty after checkout — submodule did not initialize"
            exit 1
          fi
          echo "utils/jellyseerr populated: $(find utils/jellyseerr -type f | wc -l | tr -d ' ') files"

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # renovate: datasource=npm depName=bun
          bun-version: "1.3.14"

      - name: 🔧 Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          # renovate: datasource=custom.xcode depName=xcode versioning=loose
          xcode-version: "26.6"

      - name: 💾 Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: 📦 Install dependencies and reload submodules
        run: |
          bun install --frozen-lockfile
          bun run submodule-reload

      - name: 🛠️ Expo prebuild (generates ios/, runs CocoaPods)
        # `bun run prebuild` = `expo prebuild --clean` with no --no-install,
        # so it also resolves CocoaPods (including MPVKit, applied config
        # plugins, and the Xcode 26 Podfile patch) as part of this step —
        # deliberately not duplicating that with a separate `pod install`.
        run: bun run prebuild
        env:
          EXPO_TV: 0

      - name: 🔎 Verify prebuild output (fail fast, before compiling)
        # Distinguishes "prebuild/CocoaPods/MPVKit resolution failed" from
        # "Xcode compilation failed" for anyone reading a failed run.
        run: |
          set -euo pipefail

          test -d ios || { echo "::error::ios/ directory was not generated by prebuild"; exit 1; }
          echo "✓ ios/ exists"

          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "::error::No .xcworkspace found in ios/ (expected one from CocoaPods integration)"
            exit 1
          fi
          echo "✓ Found workspace: $WORKSPACE"

          test -d ios/Pods || { echo "::error::ios/Pods missing — CocoaPods did not run during prebuild"; exit 1; }
          echo "✓ ios/Pods exists"

          grep -q "MPVKit" ios/Podfile || { echo "::error::MPVKit pod entry missing from generated Podfile"; exit 1; }
          echo "✓ MPVKit present in Podfile"

          MPV_POD_DIR=$(find ios/Pods -maxdepth 1 -iname '*mpvkit*' | head -1)
          if [ -z "$MPV_POD_DIR" ]; then
            echo "::error::MPVKit pod did not resolve into ios/Pods"
            exit 1
          fi
          echo "✓ MPVKit resolved: $MPV_POD_DIR"

          MPV_MODULE_DIR=$(find ios/Pods -maxdepth 1 -iname '*mpvplayer*' | head -1)
          if [ -z "$MPV_MODULE_DIR" ]; then
            echo "::warning::mpv-player Expo module directory not found under ios/Pods by that name — pod naming may differ, not treated as fatal here (the compile step below is the real check)"
          else
            echo "✓ mpv-player native module resolved: $MPV_MODULE_DIR"
          fi

          echo "--- ios/ top level ---"
          ls ios

      - name: 🚀 Compile (unsigned Xcode archive, no signing)
        # Reuses the exact proven, existing build-apps.yml unsigned-iOS
        # path: `EXPO_TV=0 bun scripts/ios/build-ios.ts --production`.
        # --production defaults skipCredentials=true (unsigned), which
        # internally runs:
        #   xcodebuild -workspace <ws> -scheme <scheme> -configuration Release
        #     -archivePath build/<scheme>.xcarchive archive
        #     CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
        # `archive` (no -destination) targets a generic/Any-iOS-Device build,
        # not the simulator — this compiles the real arm64 device slice of
        # MPVKit and all native Swift code, which a simulator build would
        # not meaningfully validate. Full output is both streamed live and
        # captured to a log file for the failure-artifact step below.
        run: |
          set -o pipefail
          bun run ios:unsigned-build 2>&1 | tee "$RUNNER_TEMP/ios-build.log"
        env:
          EXPO_TV: 0

      - name: ✅ Report result
        if: success()
        run: |
          echo "### ✅ Renata compiled successfully (unsigned, iOS device archive)" >> "$GITHUB_STEP_SUMMARY"
          find build -maxdepth 1 \( -name "*.xcarchive" -o -name "*.ipa" \) -exec echo "- {}" \; >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: 🔎 Verify unsigned IPA was produced
        # scripts/ios/build-ios.ts's --skip-credentials path hand-packages
        # build/Renata.ipa from the archive on success (see the compile
        # step above) — confirm it's actually there before trying to
        # upload it, so a build that reports success but didn't produce
        # the IPA fails loudly here instead of silently skipping the
        # upload or uploading nothing.
        if: success()
        run: |
          set -euo pipefail
          if [ ! -f build/Renata.ipa ]; then
            echo "::error::Build reported success but build/Renata.ipa is missing"
            exit 1
          fi
          echo "✓ build/Renata.ipa exists ($(du -h build/Renata.ipa | cut -f1))"

      - name: 📤 Upload unsigned IPA
        # Unsigned testing artifact only — CODE_SIGNING_ALLOWED=NO in the
        # compile step above, no signing here either. Not expected to
        # install directly on a physical iPhone.
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Renata-iOS-unsigned
          path: build/Renata.ipa
          retention-days: 14
          if-no-files-found: error

      - name: 📤 Upload build log (failure only)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: renata-ios-build-log-${{ github.run_id }}
          path: ${{ runner.temp }}/ios-build.log
          retention-days: 14

      - name: 📤 Upload xcarchive (failure diagnostics only, excludes DerivedData)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: renata-ios-xcarchive-${{ github.run_id }}
          path: build/*.xcarchive
          retention-days: 7
          if-no-files-found: ignore
